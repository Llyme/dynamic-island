<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NADI</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="hub.css" />
  </head>
  <body>
    <script>
      // forward uncaught JS errors to the Rust log (surfaced in debug builds)
      window.addEventListener("error", (e) => {
        try { window.__TAURI__.event.emit("js-error", `${e.message} @ ${e.filename}:${e.lineno}:${e.colno}`); } catch (_) {}
      });
      window.addEventListener("unhandledrejection", (e) => {
        try { window.__TAURI__.event.emit("js-error", `unhandled rejection: ${e.reason}`); } catch (_) {}
      });
    </script>
    <!-- the glow that builds at the top edge while the island is being "called" -->
    <div id="call-glow" aria-hidden="true">
      <i class="halo"></i>
      <i class="core"></i>
    </div>
    <canvas id="viz-bleed" aria-hidden="true"></canvas>
    <div id="pill-glow" aria-hidden="true"></div>
    <div id="pill">
      <div id="bg" aria-hidden="true">
        <div class="bg-layer" id="bg-compact"></div>
        <div class="bg-layer" id="bg-hub"></div>
      </div>
      <div id="lock-badge" aria-hidden="true"></div>
      <canvas id="viz"></canvas>
      <canvas id="face"></canvas>
      <div id="media" class="hidden">
        <img id="media-art" alt="" />
        <div class="text-col">
          <div id="media-title" class="line-main"></div>
          <div id="media-artist" class="line-sub"></div>
        </div>
        <div id="media-controls">
          <button id="media-prev"></button>
          <button id="media-play"></button>
          <button id="media-next"></button>
        </div>
        <div id="media-progress" class="hidden"><div></div></div>
      </div>
      <div id="game" class="hidden">
        <div id="game-icon">🎮</div>
        <img id="game-icon-img" class="hidden" alt="" />
        <div id="game-name"></div>
        <span id="game-more" class="hidden"></span>
        <span class="g-fps" id="game-fps" hidden><b></b><small>FPS</small></span>
        <div class="g-rings" id="game-rings"></div>
      </div>
      <div id="work" class="hidden">
        <div id="work-icon"></div>
        <div class="text-col">
          <div id="work-label" class="line-main"></div>
          <div id="work-app" class="line-sub"></div>
        </div>
        <span id="work-time"></span>
      </div>
      <div id="notification" class="hidden">
        <div id="notif-icon"></div>
        <div class="text-col">
          <div id="notif-title"></div>
          <div id="notif-body"></div>
        </div>
        <div id="notif-timer"><div></div></div>
      </div>
      <div id="brief" class="hidden">
        <div id="brief-tile" class="llm-tile"></div>
        <div id="brief-title"></div>
        <div id="brief-right" class="llm-right"></div>
      </div>
      <div id="usage-peek" class="hidden">
        <div class="peek-row"><span class="peek-label">5h</span><div class="peek-track"><div class="peek-fill" id="peek-fill-five_hour"></div></div><span class="peek-pct" id="peek-pct-five_hour"></span></div>
        <div class="peek-row"><span class="peek-label">7d</span><div class="peek-track"><div class="peek-fill" id="peek-fill-seven_day"></div></div><span class="peek-pct" id="peek-pct-seven_day"></span></div>
      </div>
      <div id="hub" class="hidden">
        <div id="hub-head">
          <canvas id="hub-eyes"></canvas>
          <div id="hub-clock" data-tip="Calendar"><span id="hub-time"></span><span id="hub-date"></span></div>
          <div id="hub-rings">
            <span class="ring-wrap hidden" id="ring-five_hour" data-color="#E8963C"></span>
            <span class="ring-wrap hidden" id="ring-seven_day" data-color="#E8963C"></span>
            <span class="ring-wrap" id="ring-cpu" data-color="#5AC8E6"></span>
            <span class="ring-wrap" id="ring-ram" data-color="#B47EE6"></span>
            <span class="ring-wrap hidden" id="ring-gpu" data-color="#8ADB6E"></span>
          </div>
        </div>
        <div id="hub-body">
          <div id="pane-settings" class="hidden">
            <div class="hub-section-title">Behavior</div>
            <div class="hub-group spot">
              <label class="hub-row">
                <span>Games</span>
                <input type="checkbox" id="set-game-detection" />
              </label>
              <label class="hub-row">
                <span>Work</span>
                <input type="checkbox" id="set-work-detection" />
              </label>
              <label class="hub-row">
                <span>Downloads</span>
                <input type="checkbox" id="set-download-detection" />
              </label>
              <label class="hub-row">
                <span>LLM</span>
                <input type="checkbox" id="set-llm-detection" />
              </label>
              <label class="hub-row">
                <span>LLM Alerts</span>
                <input type="checkbox" id="set-llm-brief" />
              </label>
              <label class="hub-row">
                <span>Page Text</span>
                <input type="checkbox" id="set-page-preview" />
              </label>
              <label class="hub-row">
                <span>Autostart</span>
                <input type="checkbox" id="set-start-with-windows" />
              </label>
            </div>

            <div class="hub-section-title">Island</div>
            <div class="hub-group spot">
              <label class="hub-row">
                <span>At Cursor</span>
                <input type="checkbox" id="set-show-at-cursor" />
              </label>
              <label class="hub-row">
                <span>Follow Cursor</span>
                <input type="checkbox" id="set-cursor-follow" />
              </label>
              <div class="hub-row">
                <span>Theme</span>
                <span class="hub-row-value swatches" id="set-accent"></span>
              </div>
              <label class="hub-row">
                <span>Eyes</span>
                <input type="checkbox" id="set-show-eyes" />
              </label>
              <label class="hub-row">
                <span>Sound</span>
                <input type="checkbox" id="set-react-to-audio" />
              </label>
              <label class="hub-row">
                <span>Ambient</span>
                <span class="hub-row-value">
                  <input type="range" id="set-audio-bleed" data-default="60" min="0" max="100" step="5" />
                  <span id="set-audio-bleed-label"></span>
                </span>
              </label>
              <label class="hub-row">
                <span>Hover Delay</span>
                <span class="hub-row-value">
                  <input type="range" id="set-edge-dwell" data-default="300" min="0" max="1000" step="50" />
                  <span id="set-edge-dwell-label"></span>
                </span>
              </label>
              <label class="hub-row">
                <span>Hide Delay</span>
                <span class="hub-row-value">
                  <input type="range" id="set-idle-hide-delay" data-default="1" min="1" max="15" step="1" />
                  <span id="set-idle-hide-delay-label"></span>
                </span>
              </label>
              <label class="hub-row">
                <span>Width</span>
                <span class="hub-row-value">
                  <input type="range" id="set-compact-width" data-default="260" min="180" max="560" step="10" />
                  <span id="set-compact-width-label"></span>
                </span>
              </label>
              <label class="hub-row">
                <span>Hub Width</span>
                <span class="hub-row-value">
                  <input type="range" id="set-hub-width" data-default="420" min="340" max="640" step="10" />
                  <span id="set-hub-width-label"></span>
                </span>
              </label>
              <label class="hub-row">
                <span>Top Distance</span>
                <span class="hub-row-value">
                  <input type="range" id="set-top-margin" data-default="4" min="0" max="80" step="2" />
                  <span id="set-top-margin-label"></span>
                </span>
              </label>
              <label class="hub-row">
                <span>Pinned Size</span>
                <span class="hub-row-value">
                  <input type="range" id="set-pin-shrink" data-default="75" min="40" max="100" step="5" />
                  <span id="set-pin-shrink-label"></span>
                </span>
              </label>
              <label class="hub-row">
                <span>Peek</span>
                <span class="hub-row-value">
                  <input type="range" id="set-peek-duration" data-default="3" min="1" max="15" step="1" />
                  <span id="set-peek-duration-label"></span>
                </span>
              </label>
              <label class="hub-row">
                <span>Glow</span>
                <span class="hub-row-value">
                  <input type="range" id="set-glow" data-default="70" min="0" max="100" step="5" />
                  <span id="set-glow-label"></span>
                </span>
              </label>
            </div>

            <div class="hub-section-title">Background</div>
            <div class="hub-group spot">
              <div class="hub-row">
                <span>Island</span>
                <span class="hub-row-value">
                  <span class="bg-name" id="bg-name-compact"></span>
                  <button class="hub-btn" id="bg-pick-compact">Choose</button>
                  <button class="hub-btn hub-btn-x hidden" id="bg-clear-compact" data-tip="Remove">✕</button>
                </span>
              </div>
              <div class="hub-row">
                <span>Expanded</span>
                <span class="hub-row-value">
                  <span class="bg-name" id="bg-name-hub"></span>
                  <button class="hub-btn" id="bg-pick-hub">Choose</button>
                  <button class="hub-btn hub-btn-x hidden" id="bg-clear-hub" data-tip="Remove">✕</button>
                </span>
              </div>
              <label class="hub-row">
                <span>Dim</span>
                <span class="hub-row-value">
                  <input type="range" id="set-bg-dim" data-default="50" min="0" max="90" step="5" />
                  <span id="set-bg-dim-label"></span>
                </span>
              </label>
              <div class="hub-row hub-row-note" id="bg-error"></div>
            </div>

            <div class="hub-section-title">Calendar</div>
            <div class="hub-group spot">
              <div class="hub-row hub-row-stack">
                <label class="field">
                  <span class="field-icon" aria-hidden="true"></span>
                  <input type="text" id="set-calendar-url" placeholder="Calendar link (.ics)" spellcheck="false" autocomplete="off" />
                  <button class="field-clear" id="set-calendar-clear" type="button" tabindex="-1" aria-label="Clear"></button>
                </label>
              </div>
              <label class="hub-row">
                <span>Remind</span>
                <span class="hub-row-value">
                  <input type="range" id="set-calendar-lead" data-default="15" min="1" max="60" step="1" />
                  <span id="set-calendar-lead-label"></span>
                </span>
              </label>
            </div>
          </div>

          <div id="pane-info">
            <div id="hub-media" class="now-card spot hidden">
              <div class="now-row">
                <img id="hub-media-art" class="now-icon" alt="" />
                <div class="now-text">
                  <div id="hub-media-title" class="now-title"></div>
                  <div id="hub-media-artist" class="now-sub"></div>
                </div>
                <div class="now-controls">
                  <button id="hub-media-prev" data-tip="Previous">⏮</button>
                  <button id="hub-media-play" data-tip="Play / Pause">▶</button>
                  <button id="hub-media-next" data-tip="Next">⏭</button>
                </div>
              </div>
              <div id="hub-media-extra" class="media-extra">
                <button id="hub-media-back" class="media-jump" data-tip="Back 5 seconds"></button>
                <div id="hub-media-seek" class="now-seek hidden"><div id="hub-media-seek-fill"></div></div>
                <button id="hub-media-fwd" class="media-jump" data-tip="Forward 5 seconds"></button>
                <button id="hub-media-rate" class="media-rate" data-tip="Playback speed"><span id="hub-media-rate-label">1×</span></button>
              </div>
              <div id="hub-media-rates" class="rate-menu hidden"></div>
            </div>
            <div id="now-cards" class="flat"></div>
            <div id="calendar-status" class="notif-history-empty"></div>
            <div id="calendar-events" class="flat"></div>
            <div id="notif-history" class="flat"></div>
          </div>

          <div id="pane-calendar" class="hidden">
            <div id="cal-head">
              <button id="cal-prev" aria-label="Previous month"><svg viewBox="0 0 16 16"><path d="M10 3.5 5.5 8l4.5 4.5" /></svg></button>
              <button id="cal-title" data-tip="Jump to Today"></button>
              <button id="cal-next" aria-label="Next month"><svg viewBox="0 0 16 16"><path d="M6 3.5 10.5 8 6 12.5" /></svg></button>
            </div>
            <div id="cal-week"></div>
            <div id="cal-grid"></div>
            <div id="cal-day-title"></div>
            <div id="cal-status" class="notif-history-empty"></div>
            <div id="cal-events" class="flat"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
